
name: Build Forja V6 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'forja-app-v6.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Forja V6
        run: |
          unzip -o forja-app-v6.zip -d source
          find source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          GRADLE_FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forja-V6-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_ID: v6-${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate artwork + icons + fallback photos
        run: |
          pip install pillow numpy
          python scripts/make-art.py
          python scripts/seed-photos.py

      - name: Download real photos (falls back to bundled art on error)
        run: node scripts/fetch-images.mjs
        continue-on-error: true

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forja.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/forja.keystore" >> "$GITHUB_ENV"

      - name: Create Android project (build + icons + sync)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: npm run android:init

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: forja-apk-${{ env.BUILD_ID }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
